<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FoodFit</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>Food<span>Fit</span></h1>
    <p>Choose a demo food and see how it fits your goals.</p>

    <section>
      <h2>Weight goal</h2>
      <label><input type="radio" name="goal" value="lose"> Lose weight</label>
      <label><input type="radio" name="goal" value="maintain" checked> Maintain weight</label>
      <label><input type="radio" name="goal" value="gain"> Gain weight</label>
    </section>

    <section>
      <h2>Nutrition priorities</h2>
      <label><input id="muscle" type="checkbox"> Build muscle</label>
      <label><input id="sugarGoal" type="checkbox"> Control sugar</label>
      <label><input id="simple" type="checkbox"> Prefer simple ingredients</label>
    </section>

    <section>
      <h2>Choose a demo product</h2>

      <select id="food">
        <option value="">Choose a food...</option>
        <option value="bar">Protein Bar</option>
        <option value="cereal">Frosted Cereal</option>
        <option value="yogurt">Greek Yogurt</option>
        <option value="pb">Peanut Butter</option>
      </select>

      <button id="analyze">Analyze food</button>
      <p id="message"></p>
    </section>

    <section id="result" hidden>
      <h2 id="name"></h2>
      <p id="brand"></p>

      <div class="score">
        <strong id="score"></strong>
        <span id="scoreText"></span>
      </div>

      <h3>Nutrition</h3>
      <div id="nutrition" class="grid"></div>

      <h3>Macro ratio</h3>
      <div id="macros" class="grid"></div>

      <h3>Why this score?</h3>
      <ul id="reasons"></ul>

      <h3>Ingredient flags</h3>
      <ul id="warnings"></ul>

      <h3>Ingredients</h3>
      <p id="ingredients"></p>
    </section>

    <section>
      <h2>FoodFit Goal Guide</h2>
      <img src="foodfit-goal-guide.png" alt="FoodFit macro goal guide">
    </section>
  </main>

  <footer>FoodFit demo project — sample food data only.</footer>

  <script src="app.js"></script>
</body>
</html>
